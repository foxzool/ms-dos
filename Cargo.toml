[package]
name = "ms-dos"
version = "0.1.0"
edition = "2021"
description = "MiaoSuan Decision Optimization System - a CMO-inspired tactical decision support simulator rendering OSM maps with Bevy"
license = "MIT"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset", "bevy_log", "bevy_state", "async_executor",
    "std", "bevy_winit", "default_font", "multi_threaded", "webgl2",
    "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_text", "bevy_window",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_render", "bevy_core_pipeline",
    "bevy_input_focus", "bevy_ui", "bevy_ui_render",
    "bevy_pbr",
    "jpeg",
] }
quick-xml = "0.38"
earcut = "0.4"

# 桌面端 HTTP（阻塞式，跑在 IO 任务线程）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["gzip"] }
flate2 = "1"

# 浏览器端 HTTP（fetch + Promise→Future）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Location", "History"] }
js-sys = "0.3"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

# 首次全量编译较慢；打开少量优化让运行时帧率可用，同时保留增量编译速度
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wasm 发布配置：面向 CF Pages 25MB 单文件限制压体积
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 体积分析用（保留符号名）
[profile.wasm-analyze]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
